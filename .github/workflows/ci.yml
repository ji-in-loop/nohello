name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Build before typecheck: @nohello/slack and @nohello/teams import @nohello/core's types
      # from its built dist/index.d.ts (per package.json's "types" field), which doesn't exist
      # until core is built. Typechecking first fails on a fresh checkout with no prior dist/.
      - run: npm run build --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm run test --workspaces --if-present
