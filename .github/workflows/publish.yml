name: Publish to npm

# Publishes @nohello/core, @nohello/slack, and @nohello/teams to the public npm registry using
# npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. Triggered by publishing a GitHub Release,
# or manually via workflow_dispatch. Requires a Trusted Publisher configured on each package's
# npmjs.com settings page (owner: ji-in-loop, repository: nohello, workflow filename:
# publish.yml) — see docs/PUBLISHING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag to publish under'
        required: false
        default: 'latest'

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x' # Trusted Publishing requires Node >=22.14.0
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted Publishing requires npm CLI >=11.5.1; don't rely on whatever setup-node bundled.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build --workspaces --if-present
      - run: npm run test --workspaces --if-present
      # Packages version independently, so a release usually only bumps one of them. Publishing
      # all three unconditionally would fail outright on the two whose version hasn't changed
      # (npm rejects re-publishing an existing version) and could abort the job before the
      # package that actually needed publishing ever ran. Skip any package whose current
      # version is already on the registry instead of assuming every release touches all three.
      - name: Publish @nohello/core
        working-directory: packages/core
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@nohello/core@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "@nohello/core@$PKG_VERSION is already published, skipping."
          else
            npm publish --provenance --tag "${{ inputs.tag || 'latest' }}"
          fi
      - name: Publish @nohello/slack
        working-directory: packages/slack-adapter
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@nohello/slack@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "@nohello/slack@$PKG_VERSION is already published, skipping."
          else
            npm publish --provenance --tag "${{ inputs.tag || 'latest' }}"
          fi
      - name: Publish @nohello/teams
        working-directory: packages/teams-adapter
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@nohello/teams@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "@nohello/teams@$PKG_VERSION is already published, skipping."
          else
            npm publish --provenance --tag "${{ inputs.tag || 'latest' }}"
          fi
