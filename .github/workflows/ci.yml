name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Build before typecheck: @nohello/slack and @nohello/teams import @nohello/core's types
      # from its built dist/index.d.ts (per package.json's "types" field), which doesn't exist
      # until core is built. Typechecking first fails on a fresh checkout with no prior dist/.
      - run: npm run build --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm run test --workspaces --if-present
      - run: npm run lint

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces --if-present
      - run: npm run test:coverage --workspaces --if-present
      # Each package's lcov.info records paths relative to that package's own root (e.g.
      # "src/index.ts"), which collide across packages once uploaded together — prefix each with
      # its package path so Codecov sees e.g. "packages/core/src/index.ts" and can map lines back
      # to the repo.
      - name: Normalize coverage paths to be repo-root-relative
        run: |
          for dir in packages/*/coverage; do
            pkg="${dir%/coverage}"
            if [ -f "$dir/lcov.info" ]; then
              sed -i "s|^SF:|SF:${pkg}/|" "$dir/lcov.info"
            fi
          done
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/*/coverage/lcov.info
          fail_ci_if_error: false
